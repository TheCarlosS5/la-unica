name: Database Integration Tests

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  database-tests:
    name: PHPUnit with MariaDB
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_TEST_HOST: 127.0.0.1
      DB_TEST_PORT: 3306
      DB_TEST_USERNAME: root
      DB_TEST_PASSWORD: root
      DB_TEST_DATABASE: la_unica_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install test dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Create isolated test database from project schema
        shell: bash
        run: |
          set -euo pipefail
          sed \
            -e 's/^CREATE DATABASE la_unica;$/CREATE DATABASE la_unica_test;/' \
            -e 's/^USE la_unica;$/USE la_unica_test;/' \
            referencias/db.sql |
            mysql --host=127.0.0.1 --port=3306 --user=root --password="$DB_TEST_PASSWORD" --default-character-set=utf8mb4

      - name: Run database integration tests
        run: composer test:database

      - name: Verify migration from the previous schema
        shell: bash
        run: |
          set -euo pipefail
          # Crea una base con el esquema anterior (sin precio en detalle_facturas), la migra y repite las pruebas.
          git show 0150dc2438a6e00d7d3c0baa20e73b7a34ee4d0d:referencias/db.sql |
            sed -e 's/^CREATE DATABASE la_unica;$/CREATE DATABASE la_unica_test_migracion;/' \
                -e 's/^USE la_unica;$/USE la_unica_test_migracion;/' |
            mysql --host=127.0.0.1 --port=3306 --user=root --password="$DB_TEST_PASSWORD"
          sed 's/^USE la_unica;$/USE la_unica_test_migracion;/' referencias/migraciones/001_precio_historico.sql |
            mysql --host=127.0.0.1 --port=3306 --user=root --password="$DB_TEST_PASSWORD"
          DB_TEST_DATABASE=la_unica_test_migracion composer test:database
